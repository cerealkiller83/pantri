<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Pantri — your household, stocked. A shared shopping list and pantry inventory for your family." />

    <title>Pantri — Your Household, Stocked</title>

    <!-- PWA / iOS install -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/pantri_icon_192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/pantri_icon_512.png" />
    <link rel="apple-touch-icon" href="/brand/pantri_icon_512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Status-bar style "default" tells iOS to draw the system bar (time,
      signal, battery) as a solid surface above app content rather than over
      it. "black-translucent" caused the system bar to overlap the sticky
      Pantri header on iPhone home-screen installs. We still pair this with
      env(safe-area-inset-top) padding on the AppShell header so the layout
      remains correct on notched devices in either mode.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pantri" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts: Fraunces (display), Inter (body), Allura (cursive wordmark) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Allura&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
